name: CI 演示

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-demo:
    name: CI 演示任务
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 打印信息
        run: |
          echo "👋 欢迎使用 GitHub Actions!"
          echo "当前分支: ${{ github.ref }}"
          echo "提交信息: ${{ github.event.head_commit.message }}"
          echo "提交 SHA: ${{ github.sha }}"
          echo "触发者: ${{ github.actor }}"
          echo "仓库: ${{ github.repository }}"
          echo "事件: ${{ github.event_name }}"
          echo "当前时间: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 检查系统预装工具版本
        run: |
          node --version
          python3 --version

      - name: 列出项目文件
        run: |
          ls -la
          find . -type f -not -path './.git/*'

      - name: 设置 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 ESLint 并创建配置
        run: |
          npm init -y
          npm install -D eslint @eslint/js
          # 直接生成非交互式的 ESLint Flat Config（兼容 ESLint v9+）
          cat > eslint.config.mjs << 'EOF'
          import js from '@eslint/js';

          export default [
            js.configs.recommended,
            {
              files: ['**/*.js'],
              languageOptions: {
                ecmaVersion: 2024,
                sourceType: 'module',
              },
            },
          ];
          EOF

      - name: 运行 Lint
        run: npx eslint app.js --no-error-on-unmatched-pattern || echo "⚠️ Lint 检查发现问题，但继续执行"