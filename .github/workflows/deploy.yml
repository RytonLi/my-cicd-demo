name: 自动部署到 Github Pages

on:
  push:
    branches: [ main ]

# 权限设置（部署 Pages 需要这些权限）
permissions:
  contents: read
  pages: write
  id-token: write

# 允许并发的部署？不，同一个时间只允许一个部署
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署到 Pages
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 打印部署信息
        run: |
          echo "🚀 开始部署..."
          echo "部署时间: $(date)"
          echo "提交者: ${{ github.actor }}"
          echo "提交信息: ${{ github.event.head_commit.message }}"

      - name: 列出要部署的文件
        run: |
          echo "要部署的文件: "
          ls -la
      
      - name: 设置Pages
        uses: actions/configure-pages@v4

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with: 
          path: '.'

      - name: 部署到 Github Pages
        uses: actions/deploy-pages@v4